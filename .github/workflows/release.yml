name: Release

# 发布：只在推送 v* 标签时发布（推送 master / 提 PR 都【不会】发布，那两种只跑 ci.yml 做校验）。
# 用法：
#   package.json 改版本号 → README 同步 → 提交 →
#   git tag v0.3.27 && git push origin v0.3.27
# 标签必须与 package.json 版本一致（v + version），否则工作流直接报错退出。
# 手动触发（workflow_dispatch）不填 tag 时，按当前 package.json 版本发。
on:
  push:
    tags: ['v*'] # 只匹配标签；不要加 branches，否则推 master 也会发版
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（如 v0.3.27）；留空则按 package.json 当前版本发
        required: false

jobs:
  release:
    # 双重保险：push 侧只订阅了 tags，这里再校验一次 ref，
    # 万一以后加了 branches / 其他触发方式也不会误发布。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成发布说明需要完整历史与标签

      # 同 ci.yml：pnpm 版本取自 package.json 的 packageManager，此处不要指定 version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验标签与 package.json 版本一致
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          WANT="v$VERSION"
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # 手动触发且未填标签 → 按当前 package.json 版本发
            TAG="$WANT"
          fi
          echo "tag=$TAG package.json version=$VERSION"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::标签 $TAG 与 package.json 版本 $VERSION 不一致（应为 $WANT）"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 构建
        run: pnpm run build

      - name: 冒烟测试
        run: pnpm test

      - name: 打包 vsix
        run: node node_modules/@vscode/vsce/vsce package --no-dependencies

      - name: 生成发布说明（相对上一个标签的提交列表）
        run: |
          set -euo pipefail
          # 手动触发时标签可能还没推到远端（本地也不存在），此时回退到 HEAD 的最近提交
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              git log --pretty='- %s' "$PREV..$TAG" > notes.md
            else
              git log --pretty='- %s' -n 30 "$TAG" > notes.md
            fi
          else
            git log --pretty='- %s' -n 30 > notes.md
          fi
          cat notes.md

      - name: 创建 GitHub Release 并上传 vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -s notes.md ]; then
            gh release create "$TAG" --title "TurtleGit $TAG" --notes-file notes.md "turtlegit-$VERSION.vsix"
          else
            gh release create "$TAG" --title "TurtleGit $TAG" --generate-notes "turtlegit-$VERSION.vsix"
          fi

      - name: 发布到 VS Code 市场（可选）
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "未配置 VSCE_PAT 秘钥：只创建 GitHub Release，跳过市场发布"
            exit 0
          fi
          node node_modules/@vscode/vsce/vsce publish --no-dependencies -p "$VSCE_PAT"
