name: CI

# 每次推送 / PR 都跑：类型检查 → 构建 → 真实 git 仓库冒烟测试 → 试打包。
# 发布流程见 release.yml（打 v* 标签触发）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段决定（pnpm@11.24.0，与本机一致）。
      # 不要再在这里写 version: —— action-setup 同时见到 version 与 packageManager 会直接报错退出。
      # 用 pnpm 11 的原因：pnpm-workspace.yaml 用的是 pnpm 11 的 allowBuilds 字段
      # （审批 esbuild / @vscode/vsce-sign 的构建脚本），旧版 pnpm 不认识该字段且强制要求
      # packages 字段，会在 pnpm store path 处报 packages field missing or empty。
      - uses: pnpm/action-setup@v4

      # vsce 4.x 要求 Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 构建（esbuild --production）
        run: pnpm run build

      - name: 冒烟测试（临时真实 git 仓库）
        run: pnpm test

      - name: 试打包 vsix
        run: node node_modules/@vscode/vsce/vsce package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: turtlegit-vsix
          path: '*.vsix'
          if-no-files-found: error
